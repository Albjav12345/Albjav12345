    <rect x="0" y="0" width="484" height="42" rx="22" fill="url(#terminalChrome)" />
    <path d="M0 22C0 10.954 8.954 2 20 2H464C475.046 2 484 10.954 484 22V42H0V22Z" fill="url(#terminalChrome)" />
    <path d="M0 42.5H484" stroke="#cbd5e1" />
    <circle cx="30" cy="22" r="6" fill="#FF5F56" />
    <circle cx="52" cy="22" r="6" fill="#FFBD2E" />
    <circle cx="74" cy="22" r="6" fill="#27C93F" />
    <text x="242" y="27" text-anchor="middle" fill="#64748b" font-family="'Cascadia Code', Consolas, monospace" font-size="13">portfolio-terminal</text>

    <text x="28" y="84" fill="#00c978" font-family="'Cascadia Code', Consolas, monospace" font-size="16">&gt; systems online</text>
    <text x="28" y="118" fill="#334155" font-family="'Cascadia Code', Consolas, monospace" font-size="15">&gt; portfolio: amedina.dev</text>
    <text x="28" y="152" fill="#334155" font-family="'Cascadia Code', Consolas, monospace" font-size="15">&gt; focus: products, automation, ai</text>
    <text x="28" y="186" fill="#2f81f7" font-family="'Cascadia Code', Consolas, monospace" font-size="15">&gt; handle: @Albjav12345</text>
    <text x="28" y="220" fill="#334155" font-family="'Cascadia Code', Consolas, monospace" font-size="15">&gt; status: available for freelance</text>
    <text x="28" y="250" fill="#64748b" font-family="'Cascadia Code', Consolas, monospace" font-size="15">$ build --useful --reliable --polished</text>
