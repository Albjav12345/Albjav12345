<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7fbff" />
      <stop offset="0.52" stop-color="#eef5ff" />
      <stop offset="1" stop-color="#edf6ff" />
    </linearGradient>

    <linearGradient id="wash" x1="32" y1="32" x2="1120" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00c978" stop-opacity="0.18" />
      <stop offset="0.5" stop-color="#00c978" stop-opacity="0.04" />
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0.10" />
    </linearGradient>

    <linearGradient id="terminalBody" x1="0" y1="0" x2="0" y2="268" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" />
      <stop offset="1" stop-color="#f5f9ff" />
    </linearGradient>

    <linearGradient id="terminalChrome" x1="0" y1="0" x2="0" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f3f7fc" />
      <stop offset="1" stop-color="#eaf0f8" />
    </linearGradient>
    <linearGradient id="pillGreen" x1="64" y1="290" x2="260" y2="324" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eafff4" />
      <stop offset="1" stop-color="#d8f7e8" />
    </linearGradient>
    <linearGradient id="pillBlue" x1="274" y1="290" x2="482" y2="324" gradientUnits="userSpaceOnUse">
      <stop stop-color="#edf5ff" />
      <stop offset="1" stop-color="#dcebff" />
    </linearGradient>
    <linearGradient id="pillSlate" x1="496" y1="290" x2="712" y2="324" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4f7fb" />
      <stop offset="1" stop-color="#e8edf5" />
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" stroke="#0f172a" stroke-opacity="0.055" stroke-width="1" />
    </pattern>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#02040a" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)" />
  <rect width="1280" height="360" rx="24" fill="url(#grid)" />
  <rect width="1280" height="360" rx="24" fill="url(#wash)" />

  <circle cx="1018" cy="66" r="126" fill="#00c978" fill-opacity="0.06" filter="url(#softGlow)" />
  <circle cx="1120" cy="282" r="112" fill="#2f81f7" fill-opacity="0.08" filter="url(#softGlow)" />

  <rect x="64" y="50" width="140" height="30" rx="15" fill="#00c978" fill-opacity="0.08" stroke="#00c978" stroke-opacity="0.35" />
  <text x="134" y="70" text-anchor="middle" fill="#00c978" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">SYSTEMS / AI</text>

  <text x="64" y="134" fill="#0f172a" font-family="'Segoe UI', Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="1.2">ALBERTO</text>
  <text x="64" y="192" fill="#00c978" font-family="'Segoe UI', Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="1.2">MEDINA</text>

  <text x="64" y="228" fill="#223045" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600">FULL-STACK DEVELOPER / AUTOMATION ENGINEER / AI WORKFLOW BUILDER</text>
  <text x="64" y="262" fill="#64748b" font-family="'Segoe UI', Arial, sans-serif" font-size="18">logic first. built to be used.</text>

  <rect x="64" y="290" width="196" height="34" rx="17" fill="url(#pillGreen)" stroke="#00c978" stroke-opacity="0.24" />
  <text x="162" y="312" text-anchor="middle" fill="#0f8f63" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.1">PYTHON / REACT / UNITY</text>

  <rect x="274" y="290" width="208" height="34" rx="17" fill="url(#pillBlue)" stroke="#2f81f7" stroke-opacity="0.24" />
  <text x="378" y="312" text-anchor="middle" fill="#2556a6" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.1">PRODUCTS / AUTOMATION</text>

  <rect x="496" y="290" width="216" height="34" rx="17" fill="url(#pillSlate)" stroke="#64748b" stroke-opacity="0.20" />
  <text x="604" y="312" text-anchor="middle" fill="#334155" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.1">REMOTE / SPAIN / GLOBAL</text>

  <g transform="translate(748 46)" filter="url(#panelShadow)">
