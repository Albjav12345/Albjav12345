    <circle cx="30" cy="22" r="6" fill="#FF5F56" />
    <circle cx="52" cy="22" r="6" fill="#FFBD2E" />
    <circle cx="74" cy="22" r="6" fill="#27C93F" />
    <text x="242" y="27" text-anchor="middle" fill="#9AA4B2" font-family="'Cascadia Code', Consolas, monospace" font-size="13">portfolio-terminal</text>

    <text x="28" y="84" fill="#00ff9d" font-family="'Cascadia Code', Consolas, monospace" font-size="16">&gt; systems online</text>
    <text x="28" y="118" fill="#C7D0DB" font-family="'Cascadia Code', Consolas, monospace" font-size="15">&gt; portfolio: amedina.dev</text>
    <text x="28" y="152" fill="#C7D0DB" font-family="'Cascadia Code', Consolas, monospace" font-size="15">&gt; focus: products, automation, ai</text>
    <text x="28" y="186" fill="#58A6FF" font-family="'Cascadia Code', Consolas, monospace" font-size="15">&gt; handle: @Albjav12345</text>
    <text x="28" y="220" fill="#C7D0DB" font-family="'Cascadia Code', Consolas, monospace" font-size="15">&gt; status: available for freelance</text>
    <text x="28" y="250" fill="#9AA4B2" font-family="'Cascadia Code', Consolas, monospace" font-size="15">$ build --useful --reliable --polished</text>
